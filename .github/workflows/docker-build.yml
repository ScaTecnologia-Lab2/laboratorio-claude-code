name: Docker Build, Scan & Deploy

# ============================================================================
# GATILHOS:
#   - push / pull_request na main → roda AUTOMATICAMENTE só build + scan
#     (Trivy) das 3 imagens. Uma imagem com vulnerabilidade CRITICAL/HIGH
#     quebra o PR.
#   - workflow_dispatch (manual, aba Actions → "Run workflow") → build + scan
#     e, se marcado nos inputs, publish no Docker Hub e/ou deploy em produção.
# Publish e deploy NUNCA rodam automaticamente: os dois jobs exigem
# github.event_name == 'workflow_dispatch'. O hook
# .claude/hooks/pipeline-guardrail.js bloqueia edições que removam essa trava.
#
# Caminho completo (GitOps com Argo CD — ver docs/K8S_FLUXO_DEV_CICD.md):
#   build → scan (Trivy) → publish no Docker Hub (tag = SHA do commit)
#   → deploy-production: SÓ depois de aprovação humana no ambiente protegido
#     "production", grava a nova tag em k8s/overlays/producao na branch
#     `producao` → o Argo CD, dentro do cluster, percebe e aplica.
# O GitHub nunca acessa o cluster: é o cluster que puxa do Git.
#
# Configuração necessária (uma vez), em Settings → Secrets and variables →
# Actions:
#   - Variable DOCKERHUB_USERNAME = seu usuário do Docker Hub
#   - Secret   DOCKERHUB_TOKEN    = access token do Docker Hub (Read & Write)
# E o Environment "production" com Required reviewers (já existe).
# ============================================================================
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Publicar as 3 imagens no Docker Hub (tag = SHA do commit)?"
        type: boolean
        default: false
      deploy_production:
        description: "Deploy em produção (Kubernetes via Argo CD)? Exige publicar e aprovação do ambiente production."
        type: boolean
        default: false

# Menor privilégio: o GITHUB_TOKEN dos jobs só lê o repositório.
# Só o job `deploy-production` declara `contents: write` (grava a branch producao).
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # BUILD — gera cada imagem a partir do Dockerfile correspondente.
  # (Os nomes "Build imagem Node"/"...Python" são checks obrigatórios do
  # ruleset da main — não renomeie sem atualizar o ruleset.)
  # ──────────────────────────────────────────────────────────────────────
  build-node:
    name: Build imagem Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t labsystem-node:${{ github.sha }} -f Dockerfile .
      - name: Salvar imagem para os próximos jobs
        run: docker save labsystem-node:${{ github.sha }} -o labsystem-node.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-node
          path: labsystem-node.tar
          retention-days: 1

  build-python:
    name: Build imagem Python (Fornecedores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t labsystem-fornecedores:${{ github.sha }} -f Dockerfile.python .
      - name: Salvar imagem para os próximos jobs
        run: docker save labsystem-fornecedores:${{ github.sha }} -o labsystem-fornecedores.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-fornecedores
          path: labsystem-fornecedores.tar
          retention-days: 1

  build-frontend:
    name: Build imagem Frontend (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t labsystem-frontend:${{ github.sha }} -f Dockerfile.frontend .
      - name: Salvar imagem para os próximos jobs
        run: docker save labsystem-frontend:${{ github.sha }} -o labsystem-frontend.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-frontend
          path: labsystem-frontend.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────
  # SCAN — segurança da informação: nenhuma imagem publicada ou implantada
  # sem passar por scan de vulnerabilidades (Trivy). Mesmo princípio do
  # job `security-scan` do ci.yml, agora aplicado à imagem final.
  # ──────────────────────────────────────────────────────────────────────
  scan-node:
    name: Scan de vulnerabilidades — imagem Node
    runs-on: ubuntu-latest
    needs: build-node
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-node
      - run: docker load -i labsystem-node.tar
      - name: Trivy — scan da imagem
        # Fixado por SHA do commit (v0.36.0): tags podem ser reapontadas, o SHA não.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "labsystem-node:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # falha o job (e bloqueia o deploy) se achar CRITICAL/HIGH
          # Ignora CVEs sem correção publicada (comuns em pacotes do SO da imagem
          # base): o scan só barra o que dá para resolver atualizando algo.
          ignore-unfixed: true

  scan-python:
    name: Scan de vulnerabilidades — imagem Python
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-fornecedores
      - run: docker load -i labsystem-fornecedores.tar
      - name: Trivy — scan da imagem
        # Fixado por SHA do commit (v0.36.0): tags podem ser reapontadas, o SHA não.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "labsystem-fornecedores:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  scan-frontend:
    name: Scan de vulnerabilidades — imagem Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-frontend
      - run: docker load -i labsystem-frontend.tar
      - name: Trivy — scan da imagem
        # Fixado por SHA do commit (v0.36.0): tags podem ser reapontadas, o SHA não.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "labsystem-frontend:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────────────────────
  # PUBLISH (opcional) — só roda se `push_image` for marcado ao disparar
  # o workflow manualmente. Requer as 3 imagens aprovadas no scan.
  # Publica no Docker Hub como <usuario>/labsystem-<servico>:<sha>.
  # ("backend" é a imagem do Dockerfile Node — mesmo nome usado no Kubernetes.)
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publicar imagens no Docker Hub (opcional)
    runs-on: ubuntu-latest
    needs: [scan-node, scan-python, scan-frontend]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-node
      - uses: actions/download-artifact@v8
        with:
          name: image-fornecedores
      - uses: actions/download-artifact@v8
        with:
          name: image-frontend
      - run: |
          docker load -i labsystem-node.tar
          docker load -i labsystem-fornecedores.tar
          docker load -i labsystem-frontend.tar
      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag e push
        env:
          USUARIO: ${{ vars.DOCKERHUB_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          for par in node:backend fornecedores:fornecedores frontend:frontend; do
            local_name=labsystem-${par%%:*}
            hub_name=docker.io/$USUARIO/labsystem-${par##*:}
            docker tag "$local_name:$SHA" "$hub_name:$SHA"
            docker push "$hub_name:$SHA"
          done

  # ──────────────────────────────────────────────────────────────────────
  # DEPLOY — só roda se `deploy_production` E `push_image` forem marcados E
  # alguém com permissão aprovar no ambiente "production" (GitHub
  # Environment com required reviewers): o "portão de segurança humano".
  #
  # GitOps: este job NÃO fala com o cluster. Ele grava a nova versão no Git
  # (branch `producao` = main neste commit + troca da tag das imagens) e o
  # Argo CD, que observa essa branch (k8s/argocd/application.yaml), aplica.
  # Rollback: reexecute ("Re-run all jobs") um run antigo deste workflow —
  # ele grava de volta a tag daquele commit (e pede aprovação de novo).
  # ──────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy em produção (requer aprovação)
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production && inputs.push_image }}
    environment:
      name: production
    permissions:
      contents: write   # para gravar a branch producao
    steps:
      - uses: actions/checkout@v7
      - name: Gravar a nova versão em k8s/overlays/producao
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i "s/^\(    newTag:\).*/\1 \"$SHA\"/" k8s/overlays/producao/kustomization.yaml
          grep -n "newName\|newTag" k8s/overlays/producao/kustomization.yaml
      - name: Publicar na branch producao (o Argo CD aplica em até ~3 min)
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: produção na versão ${SHA::7} (aprovado no environment production, disparado por $ACTOR)"
          # A branch producao é um "ponteiro" do que roda em produção: cada
          # deploy a substitui por main@SHA + 1 commit com a tag nova.
          git push --force origin HEAD:producao
          echo "### Deploy gravado na branch producao: \`${SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "O Argo CD sincroniza em até ~3 minutos (ou clique em Refresh no painel)." >> "$GITHUB_STEP_SUMMARY"
