<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSystem — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/swagger.json',
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      tryItOutEnabled: true,          // "Try it out" já vem ligado em cada rota
      displayRequestDuration: true,   // mostra quantos ms cada chamada levou
      filter: true,                   // caixa de busca por rota/grupo
      docExpansion: 'list',           // grupos abertos, rotas fechadas
      defaultModelsExpandDepth: 0,    // esconde a seção de schemas até você pedir
    });
  </script>
</body>
</html>
