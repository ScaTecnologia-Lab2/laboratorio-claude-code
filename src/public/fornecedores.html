<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSystem — Fornecedores</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <header class="header">
    <a href="/" class="header-logo">Lab<span>System</span></a>
    <nav class="nav" aria-label="Menu principal">
      <a href="/clientes.html">Clientes</a>
      <a href="/fornecedores.html" class="active">Fornecedores</a>
      <a href="/produtos.html">Produtos</a>
      <a href="/estoque.html">Estoque</a>
      <a href="/carrinho.html">Carrinho</a>
      <a href="/avaliacoes.html">Avaliações</a>
      <a href="/eventos.html">Eventos</a>
      <a href="/relatorio.html">Relatório</a>
      <a href="/usuarios.html" data-admin>Usuários</a>
      <a href="/api-docs">API Docs</a>
    </nav>
    <div class="header-user">
      <span class="header-user-nome" id="usuario-nome"></span>
      <span class="badge" id="usuario-role"></span>
      <button class="btn btn-sm btn-outline" onclick="logout()">Sair</button>
    </div>
  </header>

  <main class="main">
    <div class="container container-wide">

      <h1 class="page-title">Cadastro de Fornecedores</h1>

      <div class="cadastro-layout">

      <div class="card">
        <p class="card-title" id="form-titulo">Novo Fornecedor</p>
        <form id="form-fornecedor" onsubmit="salvar(event)" novalidate>
          <input type="hidden" id="fornecedor-id" />
          <div class="form-grid">
            <div class="form-group col-2">
              <label for="nomeempresa">Razão Social</label>
              <input type="text" id="nomeempresa" placeholder="Nome jurídico da empresa" />
            </div>
            <div class="form-group col-2">
              <label for="nomefantasia">Nome Fantasia</label>
              <input type="text" id="nomefantasia" placeholder="Nome comercial" />
            </div>
            <div class="form-group">
              <label for="cnpj">CNPJ</label>
              <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" />
            </div>
            <div class="form-group">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" placeholder="(00) 00000-0000" />
            </div>
            <div class="form-group col-2">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="contato@fornecedor.com" />
            </div>
            <div class="form-group col-2">
              <label for="endereco">Endereço</label>
              <input type="text" id="endereco" placeholder="Rua, número, complemento" />
            </div>
            <div class="form-group">
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" placeholder="Bairro" />
            </div>
            <div class="form-group">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" placeholder="Cidade" />
            </div>
            <div class="form-group">
              <label for="estado">Estado (UF)</label>
              <input type="text" id="estado" placeholder="SP" maxlength="2" />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary" id="btn-cancelar" onclick="cancelarEdicao()" hidden>Cancelar</button>
          </div>
        </form>
        <div class="mensagem" id="mensagem" role="alert" aria-live="polite"></div>
      </div>

      <div class="card">
        <p class="card-title">Fornecedores cadastrados</p>
        <div class="form-group">
          <label for="busca">Buscar por nome ou CNPJ</label>
          <input type="search" id="busca" placeholder="Digite parte do nome ou do CNPJ" autocomplete="off" />
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Razão Social</th>
                <th scope="col">Nome Fantasia</th>
                <th scope="col">CNPJ</th>
                <th scope="col">Cidade</th>
                <th scope="col">Telefone</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-body"></tbody>
          </table>
        </div>
      </div>

      </div>

    </div>
  </main>

  <footer class="footer">LabSystem &copy; 2026</footer>

  <script src="/js/auth.js"></script>
  <script src="/js/fornecedores.js"></script>
</body>
</html>
