# ============================================================================
# docker-compose.hub.yml — o MESMO sistema, mas com imagens do Docker Hub
# ----------------------------------------------------------------------------
# Diferença para o docker-compose.yml: aqui NÃO há "build:". Nada é
# compilado; o Docker só BAIXA as imagens prontas (docker pull). É assim que
# um colega, um servidor ou o Kubernetes usam o que a esteira publicou —
# sem precisar do código-fonte.
#
#   DOCKERHUB_USUARIO=seuusuario docker compose -f docker-compose.hub.yml up -d
#   DOCKERHUB_USUARIO=seuusuario TAG=<sha> docker compose -f docker-compose.hub.yml up -d
#   docker compose -f docker-compose.hub.yml down
#
# Usa outro nome de projeto e volume, para não misturar com o compose de
# desenvolvimento. Não rode os dois ao mesmo tempo (ambos usam a porta 3000).
# ============================================================================
name: labsystem-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "5151"
      POSTGRES_DB: laboratorio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dados:/var/lib/postgresql/data

  backend:
    image: docker.io/${DOCKERHUB_USUARIO:?defina DOCKERHUB_USUARIO}/labsystem-backend:${TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: "5151"
      FORNECEDORES_HOST: fornecedores
      FORNECEDORES_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fornecedores:
    image: docker.io/${DOCKERHUB_USUARIO:?defina DOCKERHUB_USUARIO}/labsystem-fornecedores:${TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: "5151"
      FLASK_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: docker.io/${DOCKERHUB_USUARIO:?defina DOCKERHUB_USUARIO}/labsystem-frontend:${TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  dados:
