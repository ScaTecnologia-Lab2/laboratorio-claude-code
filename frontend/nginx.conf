# ============================================================================
# nginx.conf — container FRONTEND do LabSystem
# ----------------------------------------------------------------------------
# Duas funções:
#   1. Servidor de arquivos estáticos: entrega o HTML/CSS/JS de src/public.
#   2. Reverse proxy: tudo que NÃO é arquivo (/login, /clientes, /me...) é
#      repassado ao container BACKEND (Node), pelo nome "backend".
#
# "backend" é resolvido pelo DNS interno:
#   - no docker compose → nome do serviço no docker-compose.yml
#   - no Kubernetes     → nome do Service (k8s/base/backend.yaml)
# Por isso o MESMO container funciona nos dois lugares sem mudar nada.
# ============================================================================
upstream backend {
    server backend:3000;
}

server {
    listen 8080;                      # imagem sem root: não pode usar a porta 80
    root   /usr/share/nginx/html;

    # Nome da cópia do frontend que respondeu (veja com: curl -I).
    add_header X-Frontend-Pod $hostname always;

    location = /         { try_files /index.html   =404; }
    location = /api-docs { try_files /swagger.html =404; }

    # Usado pelo Kubernetes para saber se o nginx está vivo.
    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Existe o arquivo? Entrega. Não existe? É uma rota da API → backend.
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
